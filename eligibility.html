<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Eligibility Check — Campus Placement</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-topbar"></header>

      <nav class="breadcrumb-container" aria-label="Breadcrumb"></nav>

      <div class="page-content">
        <div class="page-header">
          <div class="page-header-text">
            <h1>Authoritative Eligibility Evaluation</h1>
            <p>Institutional eligibility verification evaluated strictly against your academic standing</p>
          </div>
        </div>

        <!-- Dynamic Eligibility Evaluation Container -->
        <div id="eligibility-container">
          <div class="loading-container">
            <div class="spinner"></div>
            <span>Evaluating criteria against backend placement rules...</span>
          </div>
        </div>
      </div>

      <footer class="app-footer">
        Campus Placement Portal &bull; Eligibility Screening
      </footer>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/guards.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/eligibility.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Guards.requireRole(CONFIG.ROLES.STUDENT)) return;

      Layout.init({
        pageTitle: 'Eligibility Evaluation'
      });

      Eligibility.init();
    });
  </script>
</body>
</html>
