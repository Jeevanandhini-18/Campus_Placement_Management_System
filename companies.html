<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Folders &amp; Management — Campus Placement</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/company-folders.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-topbar"></header>

      <nav class="breadcrumb-container" aria-label="Breadcrumb"></nav>

      <div class="page-content">
        <div class="page-header">
          <div class="page-header-text">
            <h1>Company Folders &amp; Directory</h1>
            <p>Dedicated recruitment folders for every recruiting partner and organization</p>
          </div>
          <div class="page-actions" data-role="PLACEMENT_OFFICER,PLACEMENT_COORDINATOR">
            <button type="button" class="btn btn-primary" onclick="Modal.open('create-company-modal')">
              + New Company Folder
            </button>
          </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="card p-3 mb-4" style="background-color:var(--bg-surface);">
          <div class="d-flex justify-between align-center flex-wrap gap-3">
            <div style="flex:1; min-width:260px;">
              <input type="text" class="form-control" id="company-search-input" placeholder="🔍 Search companies by name or location..." />
            </div>

            <div class="d-flex align-center gap-2">
              <span class="text-xs text-secondary text-bold" style="text-transform:uppercase;">View:</span>
              <button type="button" class="btn btn-sm btn-secondary active" id="view-toggle-grid" title="Folder Grid View">
                🗂️ Grid
              </button>
              <button type="button" class="btn btn-sm btn-secondary" id="view-toggle-table" title="Table View">
                ☰ Table
              </button>
            </div>
          </div>
        </div>

        <!-- Dynamic Company Cards Container -->
        <div id="companies-container">
          <div class="loading-container">
            <div class="spinner"></div>
            <span>Loading company folders...</span>
          </div>
        </div>
      </div>

      <footer class="app-footer">
        Campus Placement Portal &bull; Company Management
      </footer>
    </main>
  </div>

  <!-- Create Company Modal -->
  <div class="modal-backdrop" id="create-company-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Establish Dedicated Company Folder</h3>
        <button class="modal-close-btn" data-modal-close="create-company-modal">&times;</button>
      </div>
      <form id="create-company-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label required" for="company-name">Company Name</label>
            <input type="text" class="form-control" id="company-name" name="name" placeholder="e.g. Infosys, TCS, Accenture, Google" required />
            <span class="form-hint">A dedicated logical folder will be initialized with this name</span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="company-location">Headquarters / Location</label>
              <input type="text" class="form-control" id="company-location" name="location" placeholder="e.g. Bengaluru, India" />
            </div>
            <div class="form-group">
              <label class="form-label" for="company-website">Official Website</label>
              <input type="url" class="form-control" id="company-website" name="website" placeholder="https://example.com" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="company-email">Primary Recruiter Contact Email</label>
            <input type="email" class="form-control" id="company-email" name="contactEmail" placeholder="recruitment@company.com" />
          </div>

          <div class="form-group">
            <label class="form-label" for="company-desc">Company Overview / Description</label>
            <textarea class="form-textarea" rows="3" id="company-desc" name="description" placeholder="Brief summary of the organization, business domains, and recruitment culture..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-modal-close="create-company-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Company Folder</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/guards.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/companies.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Guards.requireAuth()) return;

      Layout.init({
        pageTitle: 'Company Folders Directory',
        breadcrumbs: [
          { label: 'Company Folders', url: 'companies.html' }
        ]
      });

      Companies.init();
    });
  </script>
</body>
</html>
