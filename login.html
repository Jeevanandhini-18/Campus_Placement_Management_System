<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Campus Placement Portal</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background-color: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div class="card" style="max-width: 460px; width: 100%; padding: 2.25rem; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 48px; height: 48px; background: linear-gradient(135deg, var(--primary-600), var(--accent-cyan)); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem;">
        CP
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 700;">Campus Placement Portal</h1>
      <p style="font-size: 0.88rem; color: var(--text-secondary); margin-top: 0.25rem;">
        Sign in with your institutional credentials
      </p>
    </div>

    <!-- Quick 1-Click Role Fill Chips -->
    <div style="background-color: var(--bg-surface-alt); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 0.85rem; margin-bottom: 1.5rem;">
      <div class="text-xs text-bold text-secondary mb-2" style="text-transform: uppercase; letter-spacing: 0.05em;">
        Quick Role Autofill (Demo / Testing):
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-sm btn-secondary" id="fill-officer" style="font-size:0.75rem;">
          🏛️ Officer
        </button>
        <button type="button" class="btn btn-sm btn-secondary" id="fill-coordinator" style="font-size:0.75rem;">
          📋 Coordinator
        </button>
        <button type="button" class="btn btn-sm btn-secondary" id="fill-student" style="font-size:0.75rem;">
          🎓 Student
        </button>
      </div>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label required" for="email">Institutional Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="name@campus.edu" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-label required" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <div id="login-error-container"></div>

      <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; font-weight: 600;">
        Sign In to Portal
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-secondary);">
      New student? <a href="register.html" style="font-weight: 600;">Register Academic Account</a>
    </div>

    <div style="text-align: center; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle); font-size: 0.75rem; color: var(--text-muted);">
      Connected to Backend: <span id="api-base-display" style="font-family: var(--font-mono);"></span>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/guards.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Prevent authenticated users from visiting login
      Guards.requireGuest();

      const apiDisplay = document.getElementById('api-base-display');
      if (apiDisplay) apiDisplay.textContent = CONFIG.API_BASE;

      // Handle role fill chips
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');

      document.getElementById('fill-officer').addEventListener('click', () => {
        emailInput.value = 'officer@campus.edu';
        passInput.value = 'admin123';
      });

      document.getElementById('fill-coordinator').addEventListener('click', () => {
        emailInput.value = 'coordinator@campus.edu';
        passInput.value = 'coord123';
      });

      document.getElementById('fill-student').addEventListener('click', () => {
        emailInput.value = 'student@campus.edu';
        passInput.value = 'student123';
      });

      // Handle direct role URL param (e.g. login.html?role=OFFICER)
      const roleParam = Utils.getQueryParam('role');
      if (roleParam === 'OFFICER') document.getElementById('fill-officer').click();
      else if (roleParam === 'COORDINATOR') document.getElementById('fill-coordinator').click();
      else if (roleParam === 'STUDENT') document.getElementById('fill-student').click();

      // Submit handler
      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('login-submit-btn');
      const errorContainer = document.getElementById('login-error-container');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        Validation.clearFieldErrors(form);
        errorContainer.innerHTML = '';

        const email = emailInput.value.trim();
        const password = passInput.value;

        if (!Validation.isValidEmail(email)) {
          Validation.showFieldError(emailInput, 'Please enter a valid email address.');
          return;
        }
        if (!password) {
          Validation.showFieldError(passInput, 'Password is required.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying credentials...';

        try {
          const user = await Auth.login(email, password);
          Toast.success('Login Successful', `Welcome back, ${user.name}!`);
          
          setTimeout(() => {
            const redirectUrl = Utils.getQueryParam('redirect');
            if (redirectUrl) {
              window.location.href = decodeURIComponent(redirectUrl);
            } else {
              Auth.redirectToRoleDashboard();
            }
          }, 800);
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to Portal';

          if (err.isNetworkError) {
            UI.renderErrorBanner(
              errorContainer,
              `Backend offline: ${err.message}`
            );
          } else {
            UI.renderErrorBanner(
              errorContainer,
              err.message || 'Authentication failed. Please verify your credentials.'
            );
          }
        }
      });
    });
  </script>
</body>
</html>
